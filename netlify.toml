[build]
  # `vite build` defaults to mode "production", which loads `.env.production` —
  # that file is gitignored (it is the local override) and so does not exist in
  # CI, leaving every VITE_* var undefined. Build against the checked-in
  # `.env.development` instead so the deploy gets real values.
  command = "npm run build -- --mode development"
  # vite.config.ts sets build.outDir = "build", not the Vite default "dist".
  # The Netlify UI was pointing at "dist", which would publish an empty site
  # even on a green build.
  publish = "build"

[build.environment]
  NODE_VERSION = "24"
  # `--mode development` would otherwise also flip Vite's isProduction off and
  # bundle React's development build. Pinning NODE_ENV keeps a production
  # bundle while still reading the .env.development values.
  NODE_ENV = "production"
  # The bundle (web3auth + occt-import-js + polyfills, ~7.4k modules) exceeds
  # Node's default ~2GB heap during Rollup's chunk generation and OOMs.
  NODE_OPTIONS = "--max-old-space-size=4096"

# react-router-dom does client-side routing, so every deep link has to be
# served index.html rather than 404ing.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
